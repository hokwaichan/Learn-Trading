# Builds the app and publishes it to GitHub Pages on every push to main.
# The site is served from https://<user>.github.io/<repo>/, so the build is
# told its base path, and index.html is copied to 404.html so that opening a
# deep link such as /Learn-Trading/charts/BTCUSDT still loads the app.
#
# Nothing is published unless the unit tests, the build, and the browser checks
# (every screen driven in a real browser, plus the accessibility audit) pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm run dev -- --port 5173 --strictPort > dev-server.log 2>&1 &
          curl --silent --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:5173/
      - name: Smoke tests
        run: npm run smoke
      - name: Accessibility audit
        run: npm run a11y
      - name: Pages build, install and offline use
        run: |
          npm run build
          cp dist/index.html dist/404.html
          node scripts/check-pages.mjs
        env:
          BASE_PATH: /Learn-Trading/
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-check-screenshots
          path: |
            .screenshots
            dev-server.log

  deploy:
    needs: [build, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
